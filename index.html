<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AYN | أين — لوحة تحكم لإدارة الأعمال. مشروع واجهات أمامية للعرض في الملف المهني." />
    <meta name="theme-color" content="#080b16" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>AYN | أين — Business Dashboard</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <!-- Apply saved theme and language before first paint to avoid a flash of the wrong theme/direction. -->
    <script>
      (function () {
        var root = document.documentElement;
        var lang = 'ar';
        var mode = 'dark';
        try {
          lang = localStorage.getItem('ayn:lang') === 'en' ? 'en' : 'ar';
          mode = localStorage.getItem('ayn:theme') || 'dark';
        } catch (e) {}
        var theme = mode;
        if (mode === 'system') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        if (theme !== 'light' && theme !== 'dark') theme = 'dark';
        root.lang = lang;
        root.dir = lang === 'ar' ? 'rtl' : 'ltr';
        root.dataset.theme = theme;
        root.style.colorScheme = theme;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#080b16' : '#f6f7fb');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
